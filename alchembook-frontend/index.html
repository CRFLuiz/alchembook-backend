<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alchembook Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      min-height: 100vh;
    }
    .chat-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    #chat {
      border: 1px solid #ddd;
      padding: 15px;
      height: 500px;
      overflow-y: auto;
      border-radius: 10px;
    }
    .message {
      margin: 10px 0;
      padding: 10px;
      border-radius: 10px;
      max-width: 70%;
    }
    .user {
      background-color: #e3f2fd;
      align-self: flex-end;
    }
    .assistant {
      background-color: #c8e6c9;
    }
    .message-container {
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <div class="chat-container mt-5">
    <h1 class="text-center mb-4">Alchembook Chat</h1>
    <div id="chat" class="message-container"></div>
    <div class="input-group mt-3">
      <input id="message" type="text" class="form-control" placeholder="Digite sua mensagem..." onkeypress="if (event.key === 'Enter') sendMessage()">
      <button class="btn btn-primary" onclick="sendMessage()">Enviar</button>
    </div>
  </div>

  <script>
    const chatDiv = document.getElementById('chat');
    const messageInput = document.getElementById('message');
    let token = generateToken();

    function generateToken() {
      return 'sessao_' + Math.random().toString(36).substr(2, 5);
    }

    async function sendMessage() {
      const userMessage = messageInput.value.trim();
      if (!userMessage) return;

      // Adicionar mensagem do usuário
      const userMsgDiv = document.createElement('div');
      userMsgDiv.className = 'message user text-end';
      userMsgDiv.innerHTML = `<div class="bg-primary text-white p-2 rounded"> ${userMessage} </div>`;
      chatDiv.appendChild(userMsgDiv);

      messageInput.value = '';

      // Enviar para o backend
      const response = await fetch('http://34.217.15.78:3000/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: userMessage, token })
      });
      const data = await response.json();

      // Adicionar resposta do assistente
      const assistantMsgDiv = document.createElement('div');
      assistantMsgDiv.className = 'message assistant text-start';
      assistantMsgDiv.innerHTML = `<div class="bg-success text-white p-2 rounded"> ${data.response} </div>`;
      chatDiv.appendChild(assistantMsgDiv);

      chatDiv.scrollTop = chatDiv.scrollHeight;
    }
  </script>
</body>
</html>
