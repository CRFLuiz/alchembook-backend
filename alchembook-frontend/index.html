<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alchembook Chat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="chat-container mt-5">
    <h1 class="text-center mb-4">Alchembook Chat</h1>
    <div id="chat" class="message-container"></div>
    <div class="input-group mt-3">
      <input id="message" type="text" class="form-control" placeholder="Digite sua mensagem..." onkeypress="if (event.key === 'Enter') sendMessage()">
      <button class="btn btn-primary" onclick="sendMessage()">Enviar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
